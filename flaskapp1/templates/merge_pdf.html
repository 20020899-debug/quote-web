<!DOCTYPE html>
<html>
<head>
    <title>Gộp PDF</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

{% include "menu.html" %}

<div class="box">

    <h2>📑 GỘP PDF</h2>

    <form action="/merge-pdf/run"
          method="post"
          enctype="multipart/form-data">

        <div id="drop-area">

            <h3>Kéo thả PDF vào đây</h3>

            <p>hoặc</p>

            <input
                type="file"
                id="pdfs"
                name="pdfs"
                multiple
                accept=".pdf">

        </div>
        <label>Tên file sau khi gộp:</label>
        <input type="text"
               name="output_name"
               placeholder="VD: Bao_cao.pdf"
               value="Merged.pdf">
        <br><br>
        <p>
            <strong>Số file:</strong>
            <span id="file-count">0</span>
        </p>

        <div id="file-list"></div>

        <br>

        <button type="submit">
            ⭳ Gộp PDF
        </button>

    </form>

</div>

<script>

let allFiles = [];

const input = document.getElementById("pdfs");
const fileList = document.getElementById("file-list");
const fileCount = document.getElementById("file-count");
const dropArea = document.getElementById("drop-area");

// PDF.js config
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


function renderPDFPreview(file, container){

    const fileReader = new FileReader();

    fileReader.onload = function() {

        const typedarray = new Uint8Array(this.result);

        pdfjsLib.getDocument(typedarray).promise.then(pdf => {

            pdf.getPage(1).then(page => {

                const viewport = page.getViewport({ scale: 0.3 });

                const canvas = document.createElement("canvas");
                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                page.render({
                    canvasContext: context,
                    viewport: viewport
                });

                container.prepend(canvas);
            });

        });

    };

    fileReader.readAsArrayBuffer(file);
}


function refreshList(){

    fileList.innerHTML = "";

    allFiles.forEach((file, index) => {

        const row = document.createElement("div");
        row.className = "pdf-row";
        row.draggable = true;

        // LEFT: preview + name
        const left = document.createElement("div");
        left.style.display = "flex";
        left.style.alignItems = "center";
        left.style.gap = "10px";

        const info = document.createElement("div");
        info.innerHTML = `📄 ${file.name}`;

        left.appendChild(info);

        // RIGHT: delete button
        const delBtn = document.createElement("button");
        delBtn.innerHTML = "❌";
        delBtn.type = "button";
        delBtn.onclick = () => {
            allFiles.splice(index, 1);
            refreshList();
        };

        row.appendChild(left);
        row.appendChild(delBtn);

        // Drag start
        row.addEventListener("dragstart", e => {
            e.dataTransfer.setData("from", index);
        });

        // Drop reorder
        row.addEventListener("dragover", e => {
            e.preventDefault();
        });

        row.addEventListener("drop", e => {
            e.preventDefault();

            let from = e.dataTransfer.getData("from");

            let moved = allFiles.splice(from, 1)[0];
            allFiles.splice(index, 0, moved);

            refreshList();
        });

        fileList.appendChild(row);

        // 👉 render preview
        renderPDFPreview(file, left);
    });

    fileCount.textContent = allFiles.length;

    // sync input
    const dt = new DataTransfer();
    allFiles.forEach(f => dt.items.add(f));
    input.files = dt.files;
}


// chọn file
input.addEventListener("change", () => {
    allFiles.push(...input.files);
    refreshList();
});

// drop file
dropArea.addEventListener("dragover", e => e.preventDefault());

dropArea.addEventListener("drop", e => {

    e.preventDefault();

    const files = [...e.dataTransfer.files];

    files.forEach(f => {
        if(f.name.toLowerCase().endsWith(".pdf")){
            allFiles.push(f);
        }
    });

    refreshList();
});

</script>
</body>
</html>
