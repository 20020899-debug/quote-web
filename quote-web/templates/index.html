<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo giá xưởng</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h2>BÁO GIÁ XƯỞNG</h2>

        <button class="btn-add" onclick="addRow()">
            + Thêm dòng
        </button>
    </div>

    <div class="table-wrapper">

        <table id="quoteTable">

            <thead>
                 <!-- 🔥 DÒNG TIÊU ĐỀ TÙY CHỈNH -->
    <tr>
        <th colspan="8" class="system-title">
            SẢN PHẨM SYSTEM FAN GLOBAL GROUP
        </th>
    </tr>
        <!-- ITEMS-->         
    </tr>
                <tr>
                    <th style="#000000:60px">STT</th>
                    <th>Sản phẩm</th>
                    <th style="#000000:180px">Vật liệu</th>
                    <th style="#000000:100px">ĐVT</th>
                    <th style="#000000:140px">Đơn giá</th>
                    <th style="#000000:120px">Số lượng</th>
                    <th style="#000000:180px">Thành tiền</th>
                    <th style="#000000:60px"></th>
                </tr>
    <!-- 🔥 DÒNG NHẬP TÊN HỆ THỐNG -->
    <tr>
        <th colspan="8" style="padding:0;">
            <input
                type="text"
                class="system-input"
                placeholder="Nhập tên hệ thống..."
            >
        </th>
    </tr> 
            </thead>

            <tbody id="body">
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="6" class="total-label">
                        TỔNG CỘNG
                    </td>

                    <td id="total" class="total-value">
                        0
                    </td>

                    <td></td>
                </tr>
            </tfoot>

        </table>

    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
