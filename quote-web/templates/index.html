<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Báo giá</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>BẢNG BÁO GIÁ</h2>

<table id="quoteTable">
    <thead>
        <tr>
            <th>STT</th>
            <th>Tên sản phẩm</th>
            <th>Vật liệu</th>
            <th>Khối lượng (kg)</th>
            <th>Đơn giá</th>
            <th>Thành tiền</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>1</td>
            <td><input type="text"></td>
            <td>
                <select onchange="updateRow(this)">
                    <option value="">-- chọn --</option>
                    <option>S400</option>
                    <option>S450</option>
                    <option>Inox 304</option>
                    <option>Inox 201</option>
                    <option>Thép CT3</option>
                </select>
            </td>
            <td><input type="number" oninput="calcRow(this)"></td>
            <td class="price">0</td>
            <td class="total">0</td>
        </tr>
    </tbody>
</table>

<script src="/static/script.js"></script>

</body>
</html>
