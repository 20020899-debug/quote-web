<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Báo giá MVP</title>

<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<h2>BẢNG BÁO GIÁ</h2>

<table>
<thead>
<tr>
    <th>STT</th>
    <th>Sản phẩm</th>
    <th>Mã SP</th>
    <th>Vật liệu</th>
    <th>SL</th>
    <th>Đơn giá</th>
    <th>Thành tiền</th>
</tr>
</thead>

<tbody>
<tr>
    <td>1</td>

    <td style="position:relative;">
        <input oninput="search(this)">
        <div class="suggest"></div>
    </td>

    <!-- lưu mã SP ẩn -->
    <td class="code"></td>

    <td>
        <select onchange="calc(this)">
            <option>S400</option>
            <option>Inox 304</option>
        </select>
    </td>

    <td>
        <input type="number" value="1" oninput="calc(this)">
    </td>

    <td class="price">0</td>
    <td class="total">0</td>
</tr>

</tbody>
</table>

<script src="/static/js/app.js"></script>

</body>
</html>
