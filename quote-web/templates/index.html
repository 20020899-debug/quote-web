<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo giá xưởng</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="header">
        <h2>BÁO GIÁ XƯỞNG</h2>

        <button class="btn-add" onclick="addRow()">
            + Thêm dòng
        </button>
    </div>

    <div class="table-wrapper">

        <table id="quoteTable">

            <thead>
                 <!-- 🔥 DÒNG TIÊU ĐỀ TÙY CHỈNH -->
    <tr>
        <th colspan="10" style="padding:0;">
            SẢN PHẨM SYSTEM FAN GLOBAL GROUP
        </th>
    </tr>
        <!-- ITEMS-->         
    <tr>

    <th style="width:60px">
        STT
    </th>

    <th style="width:250px">
        Tên Sản Phẩm Cung Cấp
        <br>
        <small>(Supply Item)</small>
    </th>

    <th style="width:180px">
        Vật liệu
        <br>
        <small>(Material)</small>
    </th>

    <th style="width:250px">
        Đặc tính kỹ thuật
        <br>
        <small>(Specification)</small>
    </th>

    <th style="width:120px">
        Số lượng
        <br>
        <small>(Quantity)</small>
    </th>

    <th style="width:100px">
        Đơn vị
        <br>
        <small>(Unit)</small>
    </th>

    <th style="width:150px">
        Đơn giá
        <br>
        <small>(Unit Price)</small>
    </th>

    <th style="width:180px">
        Thành tiền
        <br>
        <small>(Line Total)</small>
    </th>

    <th style="width:220px">
        Xuất xứ / Ghi chú
        <br>
        <small>(Origin / Note)</small>
    </th>

    <th style="width:60px"></th>

</tr>
    <!-- 🔥 DÒNG NHẬP TÊN HỆ THỐNG -->
    <tr>
        <th colspan="8" style="padding:0;">
            <input
                type="text"
                class="system-input"
                placeholder="Nhập tên hệ thống..."
            >
        </th>
    </tr> 
            </thead>

            <tbody id="body">
            </tbody>

            <tfoot>
                <tr>
                    <td colspan="6" class="total-label">
                        TỔNG CỘNG
                    </td>

                    <td id="total" class="total-value">
                        0
                    </td>

                    <td></td>
                </tr>
            </tfoot>

        </table>

    </div>

</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
